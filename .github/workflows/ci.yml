# Checks every push and pull request. The Cloudflare build already validates
# content, so this adds the rule tests, the docs link check and the browser
# smoke test before anything reaches main.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Build (validates content, checks the 500 KB budget)
        run: node tools/build.mjs
      - name: Generated files are committed and current
        run: |
          git diff --exit-code -- 'public/*.html' public/c public/checklist public/en public/sitemap.xml public/llms.txt public/robots.txt public/sw.js public/js/version.js
          new=$(git ls-files --others --exclude-standard public)
          if [ -n "$new" ]; then echo "Generated but not committed:"; echo "$new"; exit 1; fi
      - run: npm test
      - run: npm run check:docs

  smoke:
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      # The browser comes from Playwright's own host, with retries. The system packages come from
      # Ubuntu's mirrors, which failed to resolve on 11 Nov 2026 (runs 60 and 61): the runner already
      # has every library Chromium needs, so that step only adds fonts and may fail without failing
      # the run. Never wrap the apt step in a retry: a killed try leaves apt holding its lock.
      - name: Install Chromium for the pinned Playwright
        timeout-minutes: 12
        run: |
          for i in 1 2 3; do
            if timeout -k 10 180 npx playwright@1.63.0 install chromium; then exit 0; fi
            echo "Chromium download try $i failed or took over 3 minutes; trying again"
            sleep 10
          done
          exit 1
      - name: System packages for Chromium (fonts; best effort)
        continue-on-error: true
        timeout-minutes: 6
        run: timeout -k 15 300 npx playwright@1.63.0 install-deps chromium
      # The hazard pages don't load Kanit; their Thai falls back to the system's font, Loma
      # (fonts-tlwg-loma-otf, from the step above). Without it Thai lays out differently and two
      # layout checks fail for that reason alone (run 62, 11 Nov 2026), so say so first.
      - name: Thai fallback font (Loma) present
        run: |
          if ! fc-list | grep -q 'Loma'; then
            echo "::warning title=No Thai font::Loma is missing (Ubuntu's mirrors unreachable?), so the layout checks of the hazard pages may fail for that reason alone"
          fi
      - run: node tools/build.mjs
      - run: npm run smoke
