# Cloudflare Pages project config (used by Git builds and `wrangler pages deploy`).
# Once this file exists, these settings come from here, not the dashboard.
name = "baanrodmai"
pages_build_output_dir = "./public"
compatibility_date = "2026-10-01"

# Anonymous event counts for the metrics plan (docs/05-metrics.md).
# Workers Analytics Engine is free up to 100,000 data points/day.
# The dataset is created automatically on the first write.
[[analytics_engine_datasets]]
binding = "EVENTS"
dataset = "baanrodmai_events"
