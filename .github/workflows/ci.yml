# Checks every push and pull request. The Cloudflare build already validates
# content, so this adds the rule tests, the docs link check and the browser
# smoke test before anything reaches main.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Build (validates content, checks the 500 KB budget)
        run: node tools/build.mjs
      - name: Generated files are committed and current
        run: |
          git diff --exit-code -- 'public/*.html' public/c public/checklist public/en public/sitemap.xml public/llms.txt public/robots.txt public/sw.js public/js/version.js
          new=$(git ls-files --others --exclude-standard public)
          if [ -n "$new" ]; then echo "Generated but not committed:"; echo "$new"; exit 1; fi
      - run: npm test
      - run: npm run check:docs

  smoke:
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      # On 11 Nov 2026 this download hung for 10 minutes and the job failed before any test ran.
      # Each try gets 4 minutes; up to three tries, so one slow mirror doesn't fail the run.
      - name: Install Chromium for the pinned Playwright
        timeout-minutes: 14
        run: |
          for i in 1 2 3; do
            if timeout 240 npx playwright@1.63.0 install --with-deps chromium; then exit 0; fi
            echo "Chromium install try $i failed or took over 4 minutes; trying again"
            sleep 10
          done
          exit 1
      - run: node tools/build.mjs
      - run: npm run smoke
