<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>render</title>
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<p style="font-family:Kanit">บ้านรอดไหม? 0123456789 abc</p>
<script type="module">
import { loadCardAssets, drawResultCard, drawChecklist, drawOG } from '/js/cards.js';
import { drawCarouselPage } from '/__tools/carousel-draw.mjs';
import { carouselSets } from '/__tools/carousel.mjs';
import { geckoSVG } from '/js/mascot.js';
import { parseSvg, drawSvgInto } from '/js/svgdraw.js';
import { setModes, setGuides } from '/js/modes.js';
import { setKeepTogether } from '/js/util.js';
const cap = (id) => id.charAt(0).toUpperCase() + id.slice(1);

const get = (f) => fetch(`/content/${f}.json`).then((r) => r.json());

function icon(size, { maskable = false } = {}) {
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#FFE6B0';
  ctx.fillRect(0, 0, size, size);
  ctx.fillStyle = '#CFEAFB';
  ctx.beginPath();
  ctx.arc(size / 2, size * 1.05, size * 0.62, 0, Math.PI * 2);
  ctx.fill();
  const pad = maskable ? size * 0.2 : size * 0.08;
  const el = parseSvg(geckoSVG({ face: 'happy' })).documentElement;
  drawSvgInto(ctx, el, pad, pad, size - pad * 2, size - pad * 2, el.ownerDocument);
  return c.toDataURL('image/png');
}

window.renderAll = async (site) => {
  const [strings, checklists, helplines, config] = await Promise.all([get('strings'), get('checklists'), get('helplines'), get('config')]);
  setModes(config.modes);
  setGuides(config.guides);
  setKeepTogether(config.keepTogether); // pictures wrap Thai the way the app does
  const MODES = config.modes.map((m) => [m.code, m.id]);
  const assets = await loadCardAssets();
  const og = strings.og;
  const th = strings.th;
  const url = site || '#บ้านรอดไหม';
  const out = {};
  const canvas = () => document.createElement('canvas');

  let c = canvas();
  drawOG(c, { kind: 'default', mode: 'prepare', line1: og.defaultLine1, line2: og.defaultLine2, line3: og.defaultPill, url }, assets);
  out['og/default.png'] = c.toDataURL('image/png');

  // English link previews for the /en/ pages (strings.ogEn), same layouts.
  const ogEn = strings.ogEn;
  const enLogo = [strings.en.logoA, strings.en.logoB];
  c = canvas();
  drawOG(c, { kind: 'default', logo: enLogo, mode: 'prepare', line1: ogEn.defaultLine1, line2: ogEn.defaultLine2, line3: ogEn.defaultPill, url }, assets);
  out['og/en/default.png'] = c.toDataURL('image/png');
  for (const [m, mode] of MODES) {
    for (let s = 0; s <= 10; s++) {
      c = canvas();
      drawOG(c, {
        kind: 'challenge', logo: enLogo, mode, score: s, scoreText: `${s}/10`,
        line1: ogEn[`challengeLine${cap(mode)}`],
        line2: ogEn.challengePill, url,
      }, assets);
      out[`og/en/${m}${s}.png`] = c.toDataURL('image/png');
    }
  }

  for (const [m, mode] of MODES) {
    for (let s = 0; s <= 10; s++) {
      c = canvas();
      drawOG(c, {
        kind: 'challenge', mode, score: s, scoreText: `${s}/10`,
        line1: og[`challengeLine${cap(mode)}`],
        line2: og.challengePill, url,
      }, assets);
      out[`og/${m}${s}.png`] = c.toDataURL('image/png');
    }
  }

  // Every "what to do" guide (config.json → guides), game or not: its link
  // previews (th/en) and the 1080x1920 picture families forward.
  for (const { id } of config.guides) {
    c = canvas();
    drawOG(c, { kind: 'checklist', logo: enLogo, mode: id, line1: ogEn[`checklistTitle${cap(id)}`], line2: ogEn.checklistLine2, line3: ogEn.checklistPill, url }, assets);
    out[`og/en/checklist-${id}.png`] = c.toDataURL('image/png');
    c = canvas();
    drawOG(c, { kind: 'checklist', mode: id, line1: checklists[id].title.th, line2: og.checklistLine2, line3: og.checklistPill, url }, assets);
    out[`og/checklist-${id}.png`] = c.toDataURL('image/png');

    const main = helplines.helplines.filter((h) => h.main).map((h) => h.number);
    c = canvas();
    drawChecklist(c, {
      mode: id,
      title: checklists[id].title.th,
      subtitle: 'เก็บไว้ แล้วส่งต่อให้คนที่บ้าน',
      items: checklists[id].items.map((it) => ({ text: it.th, sprite: it.sprite })),
      helpLabel: 'เบอร์ช่วยเหลือ โทรฟรี',
      helpNumbers: main.join('  ·  '),
      // v1.11.0: the guide's own numbers with their names (config.json → guides[].calls)
      calls: (config.guides.find((g) => g.id === id).calls || main.slice(0, 3)).map((n) => helplines.helplines.find((h) => h.number === n)).map((h) => ({ number: h.number, name: h.short.th })),
      url,
      forward: 'ส่งต่อด้วยความห่วงใย ♥',
      footer: th.cardFooter,
    }, assets);
    out[`share/checklist-${id}.png`] = c.toDataURL('image/png');
  }

  // /kit, /plan and /fridge: their link previews (v1.9.0, fridge v1.10.0)
  for (const tool of ['kit', 'plan', 'fridge', 'air', 'mask', 'tools', 'hot', 'water', 'tank', 'info', 'safe', 'bag']) {
    c = canvas();
    const look = { air: 'dust', mask: 'dust', hot: 'fire', tank: 'return', bag: 'prepare', safe: 'prepare' }[tool] || 'stock'; // each tool in the look of its hazard
    drawOG(c, { kind: 'checklist', mode: look, line1: og[`${tool}Line1`], line2: og[`${tool}Line2`], line3: og[`${tool}Pill`], url }, assets);
    out[`og/${tool}.png`] = c.toDataURL('image/png');
    c = canvas();
    drawOG(c, { kind: 'checklist', logo: enLogo, mode: look, line1: ogEn[`${tool}Line1`], line2: ogEn[`${tool}Line2`], line3: ogEn[`${tool}Pill`], url }, assets);
    out[`og/en/${tool}.png`] = c.toDataURL('image/png');
  }

  // a sample result card for the docs
  c = canvas();
  drawResultCard(c, {
    mode: 'prepare', tier: 2, modeLabel: th.modePrepare, headline: 'เตรียมบ้านทัน', scoreText: '8/10',
    rankTitle: th.rankPrepare[2], grid: ['correct', 'correct', 'learned', 'correct', 'correct', 'correct'],
    cta: th.cardChallenge, url: `${url}/c/p8?h=20261007`, footer: th.cardFooter, houseLabel: 'บ้านวันที่ 7 ต.ค. 69',
    ending: th.cheerHighPrepare[0],
  }, assets);
  out['share/sample-result-prepare.png'] = c.toDataURL('image/png');
  c = canvas();
  drawResultCard(c, {
    // a perfect round played from a friend's challenge: versus line and stamp
    mode: 'return', tier: 2, modeLabel: th.modeReturn, headline: 'ตรวจบ้านผ่าน', scoreText: '10/10',
    rankTitle: th.rankReturn[2], grid: ['correct', 'correct', 'correct', 'correct', 'correct', 'correct', 'correct'],
    cta: th.cardVersus.replace('{them}', '9/10').replace('{me}', '10/10'), url: `${url}/c/r10?h=20261007`,
    perfect: th.perfectStamp, footer: th.cardFooter, houseLabel: 'บ้านวันที่ 7 ต.ค. 69',
    ending: th.cheerPerfectReturn[0],
  }, assets);
  out['share/sample-result-return.png'] = c.toDataURL('image/png');

  // Carousel posts (Thai): share/carousel/<slug>/NN.jpg. JPEG keeps a set of
  // about a dozen pages near 2 MB.
  const [items, sources, carousel] = await Promise.all([get('items'), get('sources'), get('carousel')]);
  const C = { config, strings, carousel, items: items.items, sources: sources.sources, checklists, helplines: helplines.helplines };
  for (const set of carouselSets(C, site || 'https://[DOMAIN]', 'th')) {
    for (const p of set.pages) {
      c = canvas();
      drawCarouselPage(c, p, assets);
      out[`${set.dir}/${p.file}`] = c.toDataURL('image/jpeg', 0.86);
    }
  }

  out['icons/icon-180.png'] = icon(180);
  out['icons/icon-192.png'] = icon(192);
  out['icons/icon-512.png'] = icon(512);
  out['icons/icon-maskable-512.png'] = icon(512, { maskable: true });
  return out;
};
window.ready = true;
</script>
</body>
</html>
